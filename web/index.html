<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Prism: plural system management (web preview).">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- Safari tints its top bar (and the area behind the clock) from these.
       Prism keeps them matched to the current theme via prismSetChrome. -->
  <meta name="theme-color" content="#F4F1EA">
  <meta name="apple-mobile-web-app-title" content="Prism">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Prism</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; background: #F4F1EA; }
    @media (prefers-color-scheme: dark) { html, body { background: #15121a; } }
  </style>
  <script>
    // Called by Prism whenever its theme changes, so Safari's top bar and
    // overscroll areas use the app's colour instead of white.
    window.prismSetChrome = function (hex) {
      try {
        document.documentElement.style.background = hex;
        document.body && (document.body.style.background = hex);
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        if (!metas.length) {
          var m = document.createElement('meta');
          m.name = 'theme-color';
          document.head.appendChild(m);
          metas = [m];
        }
        for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', hex);
      } catch (e) {}
    };

    // Saves a file from Prism (exports, images). The link stays alive for a
    // minute: Safari on iPhone/iPad reads it after the click returns, and
    // revoking it straight away makes the download fail.
    window.prismDownload = function (bytes, name, mime) {
      try {
        var blob = new Blob([bytes], { type: mime || 'application/octet-stream' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = name;
        a.rel = 'noopener';
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(function () {
          URL.revokeObjectURL(url);
          a.remove();
        }, 60000);
        return true;
      } catch (e) {
        return false;
      }
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
