name: Android APK

# Builds installable release APKs on GitHub, so you don't need Flutter,
# Rust or the Android SDK on your own machine. Download them from the run's
# "Artifacts" section. See docs/deploy/android-apk.md.

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      # The sync engine and media codec are Rust. Their crates pin a toolchain
      # (rust-toolchain.toml, with the Android targets) that rustup on the
      # runner installs automatically during the Gradle build.
      - name: Show Rust and Android tooling
        run: |
          rustup --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" || true

      - run: flutter --version

      - name: Fetch packages
        run: flutter pub get

      # Optional: sign with your own key so each new APK installs as an update.
      # Without these secrets the APK is signed with a throwaway debug key, and
      # installing a newer build means uninstalling the old one first (which
      # erases the app's data).
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; the APK will be debug-signed. Updates will require uninstalling first."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storeFile=../upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          } > android/app/key.properties
          echo "Release signing configured."

      - name: Build APKs
        run: |
          flutter build apk --release \
            --split-per-abi \
            --target-platform android-arm64,android-arm \
            --no-tree-shake-icons \
            --build-number "${{ github.run_number }}"

      - name: Collect APKs
        run: |
          set -euo pipefail
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          sha=$(git rev-parse --short HEAD)
          mkdir -p dist
          out=build/app/outputs/flutter-apk
          cp "$out/app-arm64-v8a-release.apk" "dist/Prism-${version}-${sha}-arm64.apk"
          cp "$out/app-armeabi-v7a-release.apk" "dist/Prism-${version}-${sha}-arm32.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)
          ls -la dist
          {
            echo "### Android APKs"
            echo
            echo "Most phones from 2017 on: **arm64**. Very old 32-bit phones: **arm32**."
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: prism-android-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f android/upload-keystore.jks android/app/key.properties
