name: Android APK

# Builds installable release APKs on GitHub, so you don't need Flutter,
# Rust or the Android SDK on your own machine. Download them from the run's
# "Artifacts" section. See docs/deploy/android-apk.md.

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  # write: publish each signed build as a GitHub release, which the app's
  # built-in updater installs over the current version.
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # The hosted runner has ~14 GB free, which the two-ABI Flutter + Rust
      # release build can exceed ("No space left on device"). Remove large
      # preinstalled toolchains Prism never uses. The Android SDK/NDK, Java
      # and Rust are left alone.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules \
            /opt/microsoft /opt/google/chrome || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          sudo apt-get clean || true
          # Preinstalled NDKs the build does not use. Keep the default NDK
          # (ANDROID_NDK_HOME, used for the Rust crates) and the versions
          # Gradle asks for; anything else is several GB of dead weight.
          keep_default="$(basename "${ANDROID_NDK_HOME:-none}")"
          for d in "$ANDROID_HOME"/ndk/*; do
            v="$(basename "$d")"
            case "$v" in
              "$keep_default"|27.0.12077973|28.2.13676358) ;;
              *) echo "Removing NDK $v"; sudo rm -rf "$d" ;;
            esac
          done
          df -h /

      # The release build runs Gradle, the Kotlin compiler, Dart's AOT
      # compiler and Rust (two ABIs) side by side; on the 16 GB runner that
      # can run out of memory and the runner gets shut down. Add swap as a
      # safety net and cap the CI build's memory use (local builds keep
      # android/gradle.properties as is).
      - name: Add swap and cap build memory
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+UseParallelGC"
            echo "kotlin.daemon.jvmargs=-Xmx2g"
            echo "org.gradle.workers.max=2"
          } >> ~/.gradle/gradle.properties
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
          free -h

      # Records memory and disk once a minute; printed at the end so a
      # failed run shows what ran out.
      - name: Start resource monitor
        run: |
          nohup bash -c 'while true; do echo "$(date +%T) $(free -m | awk "/Mem:/{print \"mem used \" \$3 \"MB of \" \$2}; /Swap:/{print \"swap \" \$3 \"MB\"}" | tr "\n" " ") disk $(df -h / | awk "NR==2{print \$4}") free"; sleep 60; done' > /tmp/resources.log 2>&1 &

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      # The sync engine and media codec are Rust. Their crates pin a toolchain
      # (rust-toolchain.toml, with the Android targets) that rustup on the
      # runner installs automatically during the Gradle build.
      - name: Show Rust and Android tooling
        run: |
          rustup --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" || true

      - run: flutter --version

      - name: Fetch packages
        run: flutter pub get

      # Optional: sign with your own key so each new APK installs as an update.
      # Without these secrets the APK is signed with a throwaway debug key, and
      # installing a newer build means uninstalling the old one first (which
      # erases the app's data).
      - name: Configure release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; the APK will be debug-signed and NOT published for in-app updates (it can't install over a signed build). See docs/deploy/android-apk.md."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storeFile=../upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          } > android/app/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Release signing configured."

      - name: Build APKs
        run: |
          # One APK for both 64-bit and 32-bit ARM phones. (Per-ABI splits
          # conflict with the debug-only abiFilters in android/app.)
          flutter build apk --release \
            --target-platform android-arm64,android-arm \
            --no-tree-shake-icons \
            --build-number "${{ github.run_number }}" \
            --dart-define=PRISM_UPDATE_REPO=${{ github.repository }} \
            --dart-define=PRISM_UPDATE_CODEBERG=${{ vars.PRISM_UPDATE_CODEBERG || 'rhileytheratchet/prismupdated' }}

      - name: Collect APKs
        run: |
          set -euo pipefail
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          sha=$(git rev-parse --short HEAD)
          mkdir -p dist
          out=build/app/outputs/flutter-apk
          cp "$out/app-release.apk" "dist/Prism-${version}-${sha}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)
          ls -la dist
          {
            echo "### Android APKs"
            echo
            echo "Works on 64-bit and 32-bit ARM Android phones (Android 8.0+)."
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: prism-android-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30

      # The app checks the latest release whose tag is android-build-<N> and
      # offers it when N is higher than its own build number. Only signed
      # builds are published: a debug-signed APK can't replace a signed one.
      - name: Publish release for in-app updates
        if: steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          tag="android-build-${{ github.run_number }}"
          apk=$(ls dist/*.apk | head -1)
          sum=$(sha256sum "$apk" | awk '{print $1}')
          {
            echo "Automated Android build from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}."
            echo
            echo "Install from inside Prism: Settings → About → App updates. It installs over the current app and keeps your data."
            echo
            echo "sha256: ${sum}"
          } > notes.md
          gh release create "$tag" dist/*.apk dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Prism ${version} (build ${{ github.run_number }})" \
            --notes-file notes.md \
            --latest
          # Keep the 10 newest automated builds.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("android-build-"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
          | while read -r old; do
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            done

      - name: Resource usage during the build
        if: always()
        run: cat /tmp/resources.log || true

      - name: Remove signing material
        if: always()
        run: rm -f android/upload-keystore.jks android/app/key.properties
