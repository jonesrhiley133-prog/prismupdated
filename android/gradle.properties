org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Cache task outputs — subsequent builds reuse cached results when inputs unchanged.
org.gradle.caching=true
# Parallel project evaluation (minimal effect for single-module Flutter project, harmless).
org.gradle.parallel=true
# Note: configuration-cache is intentionally excluded — Flutter's Gradle plugin is incompatible.
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Retry dependency downloads with backoff so a temporary Maven Central rate
# limit (HTTP 429) doesn't fail the whole build.
org.gradle.internal.repository.max.retries=6
org.gradle.internal.repository.initial.backoff=3000
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
